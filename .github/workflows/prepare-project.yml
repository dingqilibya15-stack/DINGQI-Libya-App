name: Prepare DINGQI Project

on:
workflow_dispatch:
push:
paths:
- 'DINGQI_Libya_Full_Project.zip'
- '.github/workflows/prepare-project.yml'

permissions:
contents: write

jobs:
prepare:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ github.token }}

  - name: Extract project files
    run: |
      test -f DINGQI_Libya_Full_Project.zip || exit 1
      unzip -oq DINGQI_Libya_Full_Project.zip -d extracted
      cp -an extracted/DINGQI_Libya_Full_Project/. . || true
      rm -rf extracted

  - name: Save project files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      if ! git diff --cached --quiet; then
        git commit -m "Prepare DINGQI project"
        git push
      fi
